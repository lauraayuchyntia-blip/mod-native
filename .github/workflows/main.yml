name: Build Kangetsu Lyrics Port

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout Repository ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Extract File .zip Secara Otomatis & Aman ──────────────────────
      - name: Extract zip sources safely
        run: |
          # Cari file .zip yang ada di root repository (prioritas kangetsu_lyrics_port_fixed.zip)
          if [ -f "kangetsu_lyrics_port_fixed.zip" ]; then
            ZIP_FILE="kangetsu_lyrics_port_fixed.zip"
          elif [ -f "kangetsu.zip" ]; then
            ZIP_FILE="kangetsu.zip"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak ada file .zip ditemukan di root repository!"
            ls -la
            exit 1
          fi

          echo "Mengekstrak $ZIP_FILE ..."
          mkdir -p _tmp_extract
          unzip -oq "$ZIP_FILE" -d _tmp_extract

          # Cek apakah .zip berisi proyek lengkap (ada CMakeLists.txt di dalamnya)
          CMAKE_FILE=$(find _tmp_extract -type f -name "CMakeLists.txt" | head -n 1)
          if [ -n "$CMAKE_FILE" ]; then
            PROJECT_ROOT=$(dirname "$CMAKE_FILE")
            echo "Proyek lengkap terdeteksi di $PROJECT_ROOT. Menyalin ke root..."
            # Salin seluruh isi proyek (kecuali folder .git atau .github agar workflow tidak tertimpa)
            rsync -a --exclude='.git' --exclude='.github' --exclude='*.zip' "$PROJECT_ROOT/" ./
          else
            # Jika hanya berisi source lirik (Protocol.hpp)
            PROTOCOL_FILE=$(find _tmp_extract -type f -name "Protocol.hpp" | head -n 1)
            if [ -n "$PROTOCOL_FILE" ]; then
              mkdir -p src/lyrics
              cp -f "$PROTOCOL_FILE" src/lyrics/Protocol.hpp
              echo "Berhasil menyalin $PROTOCOL_FILE ke src/lyrics/Protocol.hpp"
            else
              echo "::error::Struktur di dalam $ZIP_FILE tidak dikenali!"
              find _tmp_extract -maxdepth 4
              exit 1
            fi
          fi

          rm -rf _tmp_extract

      # ── 3. Setup Android SDK & NDK ───────────────────────────────────────
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-28" \
            "ndk;28.2.13676358"
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build rsync

      # ── 4. Configure & Build (arm64-v8a) ─────────────────────────────────
      - name: Configure & build (arm64-v8a)
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          cmake -S . -B build-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMOD_ID=kangetsu_lyrics_port \
            -DMOD_NAME="Kangetsu Lyrics (port)" \
            -DMOD_AUTHOR=clange_me \
            -DMOD_VERSION=0.2.0 \
            -DMOD_LIBRARY_NAME=kangetsu_lyrics_port \
            '-DMOD_MINECRAFT_VERSIONS=[]'
          cmake --build build-arm64 --target levi_package -j$(nproc)

      # ── 5. Upload Artifacts ──────────────────────────────────────────────
      - name: Upload .levipack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kangetsu-lyrics-levipack
          path: build-arm64/*.levipack

      # ── 6. Release (Hanya saat push tag v*) ──────────────────────────────
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-arm64/*.levipack
