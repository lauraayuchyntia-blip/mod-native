name: Build Kangetsu Lyrics Port

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout Repository ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Extract kangetsu.zip dengan Aman (Anti-Bug / Anti-Overwrite) ──
      - name: Extract kangetsu sources safely
        run: |
          if [ ! -f "kangetsu.zip" ]; then
            echo "::error::File kangetsu.zip tidak ditemukan di root repository!"
            exit 1
          fi

          # Ekstrak ke folder sementara agar struktur folder utama tidak rusak
          mkdir -p _tmp_kangetsu
          unzip -oq kangetsu.zip -d _tmp_kangetsu

          # Cari file Protocol.hpp secara dinamis (menghindari bug beda kedalaman folder zip)
          PROTOCOL_FILE=$(find _tmp_kangetsu -type f -name "Protocol.hpp" | head -n 1)
          if [ -z "$PROTOCOL_FILE" ]; then
            echo "::error::Protocol.hpp tidak ditemukan di dalam kangetsu.zip!"
            find _tmp_kangetsu -maxdepth 4
            exit 1
          fi

          mkdir -p src/lyrics
          cp -f "$PROTOCOL_FILE" src/lyrics/Protocol.hpp
          echo "Berhasil menyalin $PROTOCOL_FILE ke src/lyrics/Protocol.hpp"

          # Bersihkan folder sementara agar tidak ikut ter-package
          rm -rf _tmp_kangetsu

      # ── 3. Setup Android SDK & NDK ───────────────────────────────────────
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-28"             "ndk;28.2.13676358"
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build

      # ── 4. Configure & Build (arm64-v8a) ─────────────────────────────────
      - name: Configure & build (arm64-v8a)
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          cmake -S . -B build-arm64             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-28             -DANDROID_STL=c++_shared             -DCMAKE_BUILD_TYPE=RelWithDebInfo             -DMOD_ID=kangetsu_lyrics_port             -DMOD_NAME="Kangetsu Lyrics (port)"             -DMOD_AUTHOR=clange_me             -DMOD_VERSION=0.2.0             -DMOD_LIBRARY_NAME=kangetsu_lyrics_port             '-DMOD_MINECRAFT_VERSIONS=[]'
          cmake --build build-arm64 --target levi_package -j$(nproc)

      # ── 5. Upload Artifacts ──────────────────────────────────────────────
      - name: Upload .levipack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kangetsu-lyrics-levipack
          path: build-arm64/*.levipack

      # ── 6. Release (Hanya saat push tag v*) ──────────────────────────────
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-arm64/*.levipack
          
